<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luzon Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav id="navBar">
        <h2 id="navHeader">Luzon Weather</h2>
        <div id="searchAndDay">
            <div id="searchBar">
                <p>Search</p>
            </div>
                <div id="dateAndTime">
                    <p>time</p>
                    <p>day</p>
                </div>
                <div id="tempScale">
                    <p>C / F</p>
                </div>
        </div>
    </nav>
    <div id="weatherMetaData">
        <div id="weatherDisplay">
            main display
        </div>
        <div id="metaData">
            <div id="atmosphere">
                atmosphere
            </div>
            <div id="visibility">
                visibility
            </div>
            <div id="wind">
                wind
            </div>
            <div id="cloudiness">
                cloudiness
            </div>
            <div id="sunrise">
                sunrise
            </div>
            <div id="sunset">
                sunset
            </div>
        </div>
    </div>
    <div id="forecast">
        forecast
    </div>
    <script src="script.js"></script>
</body>
</html>
